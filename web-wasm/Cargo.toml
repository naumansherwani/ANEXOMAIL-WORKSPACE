# ANEXOMAIL WASM KERNEL (Rule 52) — ek hi kernel, andar modules. Browser mein builtin, poori website ke liye.
# Rust (async) + Tokio (LocalSet + sync channels) -> wasm32-unknown-unknown. WebTransport browser ka apna hai; Rust usay host ABI se chalata hai
# (wasm-bindgen ke bina: sandbox mein CLI nahi, aur ABI chhota/auditable rehta hai). Version har naye module ke saath badhta hai.
[package]
name = "anexo-kernel"
version = "0.19.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
serde_json = "1"
# S3b (11 Nov 2026): ML-DSA-65 for browsers without WebCrypto ML-DSA. no_std, no rng feature (the browser supplies every random byte), same crate as the server.
fips204 = { version = "0.5", default-features = false, features = ["ml-dsa-65"] }
# DK-a (20 Nov 2026): the kernel OPENS post-quantum mail. Same ML-KEM crate as the server (fips203 0.4, FIPS 203), no rng (decapsulation needs none), + X25519 + HKDF-SHA256 + AES-256-GCM, all pure Rust, no vendor.
fips203 = { version = "0.4", default-features = false, features = ["ml-kem-768"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# DK-a mailparse@1: the same parser version as the server (=0.11.5; newer ones need Rust 1.98). Features decided by measurement of the wasm size.
mail-parser = { version = "=0.11.5" }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
fips203 = { version = "0.4", default-features = false, features = ["ml-kem-768", "default-rng"] }
base64 = "0.22"
ring = "0.17"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
