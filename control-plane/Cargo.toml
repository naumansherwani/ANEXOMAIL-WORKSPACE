# ANEXOMAIL CONTROL PLANE responder (D5a-3b, 22 Nov 2026): its OWN Rust binary, never part of the Desk, founder or awam binaries.
# It answers the Admin Desk's signed read-only lookups over HTTP/3 (QUIC) with answers signed by its OWN key.
[package]
name = "anexomail-controlplane"
version = "0.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-post-quantum = "0.2"
quinn = { version = "0.11", default-features = false, features = ["ring", "rustls-ring", "runtime-tokio"] }
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
bytes = "1"
http = "1"
rustls-pemfile = "2"
rustls-native-certs = "0.8.5"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
