<!doctype html>
<html lang="en-GB" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex">
<title>Billing center — ANEXOMAIL</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0c;color:#c9ced8;font:500 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;
background:radial-gradient(60% 45% at 50% 42%,#14203a 0%,#0b0b0c 70%);padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
svg{width:88px;height:88px;filter:drop-shadow(0 0 30px rgba(86,120,210,.38));animation:in .75s cubic-bezier(.2,.7,.2,1) both,float 3.4s ease-in-out .75s infinite}
h1{margin:0;font:800 14px/1 Inter,system-ui,sans-serif;letter-spacing:.34em;text-indent:.34em;color:#c9ced8;animation:fade .7s .3s both}
p{margin:0;max-width:30ch;color:#8d94a3;font-size:14px;animation:fade .7s .5s both}
a{color:#8fa6e6;text-decoration:none}
@keyframes in{from{opacity:0;transform:scale(.82) translateY(8px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){svg,h1,p{animation:none}}
</style>
</head>
<body>
