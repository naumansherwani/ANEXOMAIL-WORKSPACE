<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0c10"><title>ANEXOMAIL Command Center OS</title>
<link rel="icon" href="/_cc/favicon.svg" type="image/svg+xml">
<style>
/* ADMIN DESK boot screen (Desk-own copy of the founder boot pattern): painted by the browser before any JavaScript runs; React replaces it with the identical DeskBoot. */
html{background:#0b0c10;color-scheme:dark}
body{margin:0;background:radial-gradient(1100px 560px at 50% -12%,#1a2748 0%,rgba(11,12,16,0) 68%),#0b0c10;background-attachment:fixed}
.boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.boot svg{width:84px;height:84px;filter:drop-shadow(0 8px 28px rgba(74,115,179,.35));animation:bootbreath 2.4s ease-in-out infinite}
.boot b{display:block;color:#e9ecf3;font-weight:600;font-size:15px;letter-spacing:.34em;text-align:center;margin-right:-.34em}
.boot small{display:block;color:#8fb0e8;font-weight:500;font-size:11px;letter-spacing:.42em;text-align:center;margin:-8px -.42em 0 0}
.boot .bar{width:132px;height:2px;border-radius:2px;background:rgba(152,162,182,.18);overflow:hidden}
.boot .bar i{display:block;width:44%;height:100%;border-radius:2px;background:linear-gradient(90deg,transparent,#8fb0e8,transparent);animation:bootrun 1.15s ease-in-out infinite}
@keyframes bootbreath{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.04);opacity:1}}
@keyframes bootrun{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.boot svg,.boot .bar i{animation:none}.boot .bar i{width:100%;opacity:.5}}
</style></head>
<body><div id="root"><div class="boot" role="status" aria-label="Loading ANEXOMAIL Command Center OS"><svg viewBox="0 0 64 64" aria-hidden="true"><defs>
<linearGradient id="ba" x1="12" y1="4" x2="54" y2="60"><stop offset="0%" stop-color="oklch(0.50 0.098 258)"/><stop offset="100%" stop-color="oklch(0.295 0.066 258)"/></linearGradient>
<linearGradient id="bb" x1="20" y1="18" x2="46" y2="46"><stop offset="0%" stop-color="oklch(0.375 0.080 258)"/><stop offset="100%" stop-color="oklch(0.245 0.052 258)"/></linearGradient>
<linearGradient id="be" x1="4" y1="4" x2="60" y2="60"><stop offset="0%" stop-color="oklch(0.975 0.004 250)"/><stop offset="60%" stop-color="oklch(0.80 0.012 252)"/><stop offset="100%" stop-color="oklch(0.60 0.016 253)"/></linearGradient></defs>
<path d="M32 4 L61 59 L45.5 59 L32 32 L18.5 59 L3 59 Z" fill="url(#ba)" stroke="url(#be)" stroke-width="1.6" stroke-linejoin="miter"/>
<path d="M32 19 L43 41 L21 41 Z" fill="url(#bb)" stroke="url(#be)" stroke-width="1.3" stroke-linejoin="miter"/>
<path d="M9 52 L56 33" stroke="url(#be)" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
<circle cx="15" cy="49.6" r="2.4" fill="oklch(0.975 0.004 250)"/><circle cx="32" cy="42.7" r="2.4" fill="oklch(0.975 0.004 250)"/><circle cx="50" cy="35.4" r="2.4" fill="oklch(0.975 0.004 250)"/></svg><b>ANEXOMAIL</b><small>COMMAND CENTER OS</small><div class="bar"><i></i></div></div></div>
<script type="module" src="/src/desk/main.tsx"></script></body></html>
