<!doctype html><meta charset=utf-8><title>Global Grid Workplace Demo</title>
<style>body{margin:0;background:#070d1a;color:#E6EBF1;font-family:Inter,system-ui,sans-serif;padding:28px 40px}.hi{font-size:20px;color:#C3CCD8;margin:0}.lab{font:600 12px Inter;letter-spacing:.12em;color:#8aa0c0;margin:26px 0 6px}.dsk-ttl{margin:4px 0 0;font-family:inherit;font-weight:600;line-height:1.05}
.dsk-hero{position:relative;padding:6px 0 4px;isolation:isolate}
.dsk-ttl .l1{display:block;position:relative;width:fit-content;font-size:clamp(28px,4.6vw,46px);font-weight:300;letter-spacing:.16em;margin-right:-.16em;color:#2C4C79;-webkit-text-stroke:.6px #E6EBF1;paint-order:stroke fill;text-shadow:0 0 26px rgba(44,76,121,.95),0 0 2px rgba(230,235,241,.5)}
.dsk-ttl .l2{display:block;width:fit-content;font-size:clamp(10px,1.3vw,13px);letter-spacing:.5em;font-weight:500;margin-top:10px;line-height:1.2;color:#DCE3EC}
.dsk-ttl .w{display:inline-block;white-space:nowrap}
.dsk-ttl .c{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.35em) scale(1.08);animation:dsk-inr .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes dsk-inr{to{opacity:1;filter:blur(0);transform:none}}
.dsk-ttl .l1::after{content:"";display:block;height:1px;width:calc(100% - .16em);margin-top:10px;background:linear-gradient(90deg,transparent 0%,rgba(230,235,241,.2) 50%,transparent 100%) -50% 0/26% 100% no-repeat,linear-gradient(90deg,#1E3557 0%,#2C4C79 22%,#C3CCD8 50%,#E6EBF1 58%,#2C4C79 82%,#1E3557 100%);box-shadow:0 0 8px rgba(44,76,121,.45);transform:scaleX(0);transform-origin:left;animation:dsk-ul 1.1s cubic-bezier(.3,.7,.2,1) 1.2s forwards,dsk-linerun 4.2s linear 2.4s infinite}
@keyframes dsk-linerun{from{background-position:-50% 0,0 0}to{background-position:150% 0,0 0}}
@keyframes dsk-ul{to{transform:scaleX(1)}}
.dsk-ttl .l1::before{content:"";position:absolute;left:12%;right:calc(12% + .16em);bottom:-22px;height:26px;pointer-events:none;border-radius:50%;filter:blur(15px);opacity:0;background:radial-gradient(closest-side,#C3CCD8 0%,#2C4C79 55%,transparent 100%);animation:dsk-lightsin 1.2s ease 1.6s forwards,dsk-lightbreath 5s ease-in-out 2.8s infinite alternate}
@keyframes dsk-lightsin{to{opacity:.2}}
@keyframes dsk-lightbreath{from{opacity:.2}to{opacity:.3}}
.dsk-halo{position:absolute;left:-6%;top:-40%;width:70%;height:220%;z-index:-1;background:radial-gradient(closest-side,rgba(111,166,242,.22),transparent 70%);animation:dsk-halo 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes dsk-halo{from{opacity:.55;transform:translateX(-3%)}to{opacity:1;transform:translateX(6%)}}
.dsk-sp{position:absolute;inset:-20px -10px;width:calc(100% + 20px);height:calc(100% + 40px);z-index:-1;pointer-events:none}
.dsk-sub{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:clamp(16px,2vw,20px);font-weight:500;color:#C3CCD8;opacity:0;animation:dsk-up .8s ease 1.4s forwards}
.dsk-sub .rule{flex:0 1 auto;min-width:12px;display:inline-block;height:1px;width:clamp(36px,8vw,90px);background:linear-gradient(90deg,transparent,#6FA6F2)}
.dsk-sub::after{content:"";display:inline-block;height:1px;width:clamp(36px,8vw,90px);background:linear-gradient(270deg,transparent,#6FA6F2)}
/* his 24 Nov 05:30 (phone): on a narrow phone the two side rules are shorter so the Senior Executive line is never wider than the title and the clock keeps its place */
@media(max-width:480px){.dsk-sub .rule,.dsk-sub::after{width:clamp(14px,4.5vw,36px)}.dsk-ttl .l2{white-space:nowrap}}
@keyframes dsk-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.dsk-ttl .c{animation:none;opacity:1;filter:none;transform:none}.dsk-ttl .l1::after{animation:none;transform:none}.dsk-ttl .l1::before{animation:none;opacity:.2}.dsk-halo{animation:none}.dsk-sub{animation:none;opacity:1}}</style>
<div class=lab>NOW (LIVE TEXT)</div><div id=a></div><div class=lab>DEMO V6: THE GLOBAL GRID WORKPLACE, INSIDE THE TITLE WIDTH</div><div id=b></div>
<script>
function mk(t){const L=["ANEXOMAIL","COMMAND CENTER OS"];let i=0;const line=(k,ln)=>`<span class="${k}" aria-hidden="true">${ln.split(" ").map(w=>{const o=`<span class="w">${[...w].map((ch,j)=>`<span class="c" style="--i:${i+j}">${ch}</span>`).join("")}</span>`;i+=w.length;return o}).join("&nbsp;")}</span>`;
return `<p class=hi>Good morning,</p><div class="dsk-hero"><div class="dsk-halo"></div><h1 class="dsk-ttl">${line("l1",L[0])}${line("l2",L[1])}</h1><div class="dsk-sub"><span class="rule"></span><span style="white-space:nowrap">${t}</span></div></div>`}
function fit(root){const a=root.querySelector(".l1"),b=root.querySelector(".l2"),u=root.querySelector(".dsk-sub");b.style.letterSpacing="0px";const ls=parseFloat(getComputedStyle(a).letterSpacing)||0;const n=b.textContent.length;const sp=Math.max(2,(a.getBoundingClientRect().width-ls-b.getBoundingClientRect().width)/(n-1));b.style.letterSpacing=sp+"px";b.style.marginRight=-sp+"px";u.style.width="fit-content";u.style.marginLeft="0px";u.style.marginLeft=Math.max(0,(a.getBoundingClientRect().width-u.getBoundingClientRect().width)/2)+"px"}
a.innerHTML=mk("Senior Executive");b.innerHTML=mk("THE GLOBAL GRID WORKPLACE");
/* V6: the long line must stay INSIDE the ANEXOMAIL width: the two side rules get short, the text size is fitted so rule+text+rule = title width */
function fit2(root){const a=root.querySelector(".l1"),u=root.querySelector(".dsk-sub"),t=u.lastElementChild,r=u.querySelector(".rule");const W=a.getBoundingClientRect().width-parseFloat(getComputedStyle(a).letterSpacing||0);const R=Math.round(Math.min(26,W*.07));r.style.width=R+"px";u.style.setProperty("--rw",R+"px");t.style.fontSize="10px";const w10=t.getBoundingClientRect().width;const fs=Math.min(20,(W-2*R-24)/w10*10);t.style.fontSize=fs+"px";u.style.width=W+"px";u.style.marginLeft="0px";u.style.justifyContent="center"}
const st=document.createElement("style");st.textContent="#b .dsk-sub::after{width:var(--rw,26px)!important}";document.head.appendChild(st);
const go2=()=>{fit2(b)};
const go=()=>{fit(a);fit(b);go2()};document.fonts.ready.then(go);addEventListener("resize",go);go();
</script>
