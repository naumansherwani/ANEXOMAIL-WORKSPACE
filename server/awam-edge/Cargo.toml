[package]
name = "anexomail-awam-edge"
version = "0.1.0"
edition = "2021"
description = "ANEXOMAIL awam edge (K5a): TLS 1.3 AES-256-GCM-only terminator + re-origination tunnel to Caddy for the awam hosts. Awam lane, its own program."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
