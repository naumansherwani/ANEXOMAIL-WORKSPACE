# ANEXOMAIL FOUNDER — alag Rust binary `anexomail-founder` (Rule 61). Bun/Node nahi.
# Plan: docs/claude/FOUNDER-BUILD-PLAN-28OCT.md  Security: docs/claude/founder/FOUNDER-SECURITY-28OCT.md
[package]
name = "anexomail-founder"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["set-header", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# R2: P-384 + SHA-512 TSA signatures (freetsa). ring has no such pair. Pure Rust (RustCrypto), VERIFY ONLY (no signing, no RNG), no C code. Used by the server only; the WASM kernel does not check CMS signatures.
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "sha384"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "der"] }
hmac = "0.12"
hex = "0.4"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
# T256-1 (TLS 1.3, AES-256-GCM only terminator + prober): rustls with the ring provider, no new C code
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
# K8c (11 Nov 2026): X25519MLKEM768 (post-quantum hybrid key exchange, listed for K4). ring has no ML-KEM, so ONLY the key-exchange group comes from aws-lc-rs; ciphers stay ring AES-256-GCM.
rustls-post-quantum = "0.2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
# K6 (WebTransport over QUIC/HTTP3): ring provider (same as rustls above), no aws-lc, no self-signed generator. AES-256-only config is built by hand in wt.rs.
# K8 (11 Nov 2026): real HTTP/3 for the founder API on its own UDP port: h3 + h3-quinn on the SAME quinn as wtransport (ring, AES-256-only config from wt::quic_config)
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["ring", "rustls-ring", "runtime-tokio"] }
http-body-util = "0.1"
bytes = "1"
wtransport = { version = "0.7", default-features = false, features = ["quinn", "ring"] }
fips204 = { version = "0.5", default-features = false, features = ["ml-dsa-65", "default-rng"] }
# Q1b (founder mailbox, 13 Nov 2026): ML-KEM-768 (FIPS 203, pure Rust, same authors as fips204) for the post-quantum key wrap in fmail_kem.rs. mail-parser 0.11.5 + mail-auth 0.9.2 come with fmail_in.rs (newer ones need Rust 1.98)
fips203 = { version = "0.4", default-features = false, features = ["ml-kem-768", "default-rng"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
[dev-dependencies]
