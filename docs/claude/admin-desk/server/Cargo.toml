# ANEXOMAIL ADMIN DESK: its OWN Rust binary `anexomail-desk` (DESK ISOLATION LAW, 21 Nov 2026). Never shares a crate, key, env file or table with the founder binary.
[package]
name = "anexomail-desk"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["set-header", "fs"] }
serde_json = "1"
# R3a0-s2 (21 Nov 2026): the Desk's OWN HTTP/3 (QUIC). Same versions as the founder stack, copied, never imported (DESK ISOLATION LAW).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-post-quantum = "0.2"
quinn = { version = "0.11", default-features = false, features = ["ring", "rustls-ring", "runtime-tokio"] }
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = { version = "0.0.10", features = ["datagram"] }
# Phase C (22 Nov 2026): WebTransport on the SAME h3 endpoint (same UDP 4400). Desk-own copy of the pattern, never imported from founder.
h3-webtransport = "0.1.2"
futures-util = "0.3"
bytes = "1"
rustls-pemfile = "2"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
subtle = "2.6.1"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
# R3d (22 Nov 2026): Rule 52 for the Desk. Desk-own Ed25519 answer signing + HKDF/HMAC request binding. Never the founder key or crate.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
hmac = "0.12"
hkdf = "0.12"
# R3a2-dbsc (23 Nov 2026): Desk-own device-bound sessions. ES256 verification with ring (already inside rustls), base64url for the JWT parts.
ring = "0.17"
base64 = "0.22"
# 1m-7 B6b (23 Nov 2026): Desk-own DNSSEC-validating DNS probe of the OWN mail domain (no outside service). Same version family as the founder stack, copied, never imported.
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config", "dnssec-ring"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
strip = true

[dev-dependencies]
wtransport = { version = "0.7", default-features = false, features = ["quinn", "ring"] }
